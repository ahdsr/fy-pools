name: Refresh NBA playoff catalog

on:
  schedule:
    - cron: "29 */6 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: nba-event-catalog-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Refresh the production NBA playoff catalog
        env:
          REFRESH_URL: ${{ secrets.NBA_EVENT_CATALOG_REFRESH_URL }}
          CRON_SECRET: ${{ secrets.NBA_EVENT_CATALOG_CRON_SECRET }}
        run: |
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          curl --fail --silent --show-error --retry 1 --retry-all-errors --connect-timeout 10 --max-time 55 \
            --header "Authorization: Bearer ${CRON_SECRET}" --output "$response_file" "${REFRESH_URL}"
          jq -e '.ok == true and .provider == "espn" and .events == 1' "$response_file" > /dev/null
          jq -r '"Refreshed NBA playoff catalog at \(.fetchedAt)."' "$response_file"
